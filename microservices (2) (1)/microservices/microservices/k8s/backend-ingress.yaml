apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthequity-api
  namespace: healthequity
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  tls:
    - hosts:
        - api.your-domain.com
      secretName: healthequity-tls
  rules:
    - host: api.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthequity-api
                port:
                  number: 80
